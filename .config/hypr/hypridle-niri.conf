# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || (ln -sf "$(awww query | head -n1 | grep -oP 'image: \K.*')" /tmp/lock_bg && hyprlock -c ~/.config/hypr/hyprlock-niri.conf)    
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

listener {
    timeout = 585
    on-timeout = brightnessctl -s set 5%         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# note: replace 'kbd_backlight' with your device name from `brightnessctl -l` if needed (e.g. asus::kbd_backlight).
listener {
    timeout = 605
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd platform::kbd_backlight
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 40
    on-timeout = pidof hyprlock && niri msg action power-off-monitors
    on-resume = pidof hyprlock && niri msg action power-on-monitors
}

listener {
    timeout = 630
    on-timeout = niri msg action power-off-monitors # screen off when timeout has passed.
    on-resume = niri msg action power-on-monitors  # screen on when activity is detected.
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
