$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /tmp/lock_bg
    fallback_path = screenshot
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%a, %b %d"
    color = rgba(220, 224, 245, 0.9)
    font_size = 16
    font_family = $font

    position = 80, -80
    halign = left
    valign = top
}

label {
    monitor =
    text = Good day, $USER
    color = rgba(220, 224, 245, 0.9)
    font_size = 16
    font_family = $font

    position = 80, -110
    halign = left
    valign = top
}


label {
    monitor =
    text = Good day, $USER
    color = rgba(220, 224, 245, 0.9)
    font_size = 16
    font_family = $font

    position = 80, -110
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H</b>"
    color = rgba(163, 173, 238, 1.0)
    font_size = 195
    font_family = $font

    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%M</b>"
    color = rgba(209, 215, 248, 1.0)
    font_size = 195
    font_family = $font

    position = 0, -70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 38
    outline_thickness = 2
    inner_color = rgba(75, 78, 109, 0.65)

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(235, 238, 255)
    fade_on_empty = false
    rounding = -1

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_size = 0.25
    dots_spacing = 0.2

    position = 0, -340
    halign = center
    valign = center
}

