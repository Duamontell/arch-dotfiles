# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock-hyprland.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# note: replace 'kbd_backlight' with your device name from `brightnessctl -l` if needed (e.g. asus::kbd_backlight).
listener {
    timeout = 900
    on-timeout = brightnessctl -sd kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session            # lock screen when timeout has passed.
}

listener {
    timeout = 40
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off when timeout has passed.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on when activity is detected.
}

listener {
    timeout = 1800                                # 30min.
    on-timeout = systemctl suspend                # suspend pc.
}
