[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 4
max_width = 1200
max_height = 1800
image_filter = "lanczos3"
image_quality = 85

[opener]
edit = [
    { run = "$EDITOR %s", block = true, desc = "$EDITOR", for = "unix" }
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { url = "*.{yml,yaml,toml,json,md,txt,conf,ini,sh,py,lua}", use = "edit" },
]

[plugin]
prepend_fetchers = [
    { url = "*", run = "git", group = "git" },
    { url = "*/", run = "git", group = "git" },
]
